[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiberhmm"
version = "3.0.0"
description = "Hidden Markov Model for calling chromatin footprints from fiber-seq and DAF-seq data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "FiberHMM Authors"}
]
keywords = [
    "bioinformatics",
    "chromatin",
    "fiber-seq",
    "DAF-seq",
    "hidden-markov-model",
    "nucleosome",
    "footprinting",
    "epigenetics",
    "single-molecule"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "pysam>=0.19",
    "tqdm>=4.60",
    # fiberhmm-consensus / fiberhmm-transfer (lattice recaller) and the
    # numba-accelerated HMM paths import these unconditionally.
    "numba>=0.55",
    "scikit-learn>=1.1",
    "joblib>=1.4.2",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
# numba/consensus are kept as aliases: their packages are core dependencies
# since 3.0, and FiberBrowser pins fiberhmm[consensus].
numba = ["numba>=0.55"]
consensus = ["numba>=0.55", "scikit-learn>=1.1", "joblib>=1.4.2", "threadpoolctl>=3.1"]
cuda = ["torch>=2.0"]
plots = ["matplotlib>=3.5"]
posteriors = ["h5py>=3.0"]
all = [
    "matplotlib>=3.5",
    "h5py>=3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/fiberseq/FiberHMM"
Documentation = "https://fiberseq.github.io/FiberHMM/"
Repository = "https://github.com/fiberseq/FiberHMM"
Issues = "https://github.com/fiberseq/FiberHMM/issues"

[project.scripts]
fiberhmm-apply = "fiberhmm.cli._entry:apply_main"
fiberhmm-train = "fiberhmm.cli._entry:train_main"
fiberhmm-extract = "fiberhmm.cli._entry:extract_main"
fiberhmm-probs = "fiberhmm.cli._entry:probs_main"
fiberhmm-utils = "fiberhmm.cli._entry:utils_main"
fiberhmm-posteriors = "fiberhmm.cli._entry:posteriors_main"
fiberhmm-daf-encode = "fiberhmm.cli._entry:daf_encode_main"
fiberhmm-daf-snps = "fiberhmm.cli._entry:daf_snps_main"
fiberhmm-call-m5c = "fiberhmm.cli._entry:call_m5c_main"
fiberhmm-tag-m5c = "fiberhmm.cli._entry:tag_m5c_main"
fiberhmm-recall-tfs = "fiberhmm.cli._entry:recall_tfs_main"
fiberhmm-recall-nucs = "fiberhmm.cli._entry:recall_nucs_main"
fiberhmm-call = "fiberhmm.cli._entry:call_main"
fiberhmm-dedup = "fiberhmm.cli._entry:dedup_main"
fiberhmm-pair = "fiberhmm.cli._entry:pair_main"
fiberhmm-merge = "fiberhmm.cli._entry:merge_main"
fiberhmm-strand-rescue = "fiberhmm.cli._entry:strand_rescue_main"
fiberhmm-strand-rescue-annotate = "fiberhmm.cli._entry:strand_rescue_annotate_main"
fiberhmm-strand-rescue-audit = "fiberhmm.cli._entry:strand_rescue_audit_main"
fiberhmm-footprint-model = "fiberhmm.cli._entry:footprint_model_main"
fiberhmm-tag-consensus = "fiberhmm.cli._entry:tag_families_main"
fiberhmm-consensus = "fiberhmm.inference.consensus.cli:main"
fiberhmm-transfer = "fiberhmm.inference.consensus.transfer_cli:main"
fiberhmm-qc = "fiberhmm.cli._entry:qc_main"

[tool.setuptools.packages.find]
include = ["fiberhmm*"]

[tool.setuptools.package-data]
"fiberhmm.models" = ["*.json", "*.md", "legacy/*.json"]
"fiberhmm.qc" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not benchmark'"
markers = [
    "benchmark: performance benchmark (run with '-m benchmark tests/benchmarks')",
    "slow: slow test (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["fiberhmm"]
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
