name: Docs

# Builds the MkDocs site from docs/ and mkdocs.yml. Pull requests only build
# (strict: any warning fails); pushes to main and version tags also deploy to
# GitHub Pages. One-time repository setting: Settings -> Pages -> Source:
# "GitHub Actions". Uses only the default GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "LICENSE"
      - "tools/gen_cli_reference.py"
      - "fiberhmm/cli/**"
      - "fiberhmm/inference/consensus/cli.py"
      - "fiberhmm/inference/consensus/transfer_cli.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  FIBERHMM_NO_UPDATE_CHECK: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FiberHMM and MkDocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"
      - name: Check the generated CLI reference is current
        run: python tools/gen_cli_reference.py --check
      - name: Build the site (strict)
        run: mkdocs build --strict --site-dir site
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
