name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FIBERHMM_NO_UPDATE_CHECK: "1"
  OPENBLAS_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
  # Linux jobs use a pinned minimap2 release binary, not the distribution
  # package: Ubuntu 24.04's minimap2 is 2.27, whose --MD writes no MD tag.
  MINIMAP2_VERSION: "2.30"
  MINIMAP2_SHA256: "b4c0677f282f448dac7bc1cd2fe5a45d12cb07a8b1edc316a45a26bbf75b7f07"
  MINIMAP2_227_SHA256: "a8971db6fbde47bdb4cab505dc2c1b099c77c2343e80d9549ed9b39a99867a60"

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: tests/test_advisories.py checks the advisory index
          # against git history and skips on a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The fiberhmm-pipeline end-to-end tests need minimap2 and the samtools
      # tests need samtools; without them those tests skip.
      - name: Install pinned minimap2 and samtools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools
          tarball="minimap2-${MINIMAP2_VERSION}_x64-linux.tar.bz2"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/lh3/minimap2/releases/download/v${MINIMAP2_VERSION}/$tarball"
          echo "$MINIMAP2_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/minimap2-${MINIMAP2_VERSION}_x64-linux" >> "$GITHUB_PATH"
      - name: Install minimap2 and samtools (macOS)
        if: runner.os == 'macOS'
        run: brew install minimap2 samtools
      - name: Install FiberHMM with all optional features and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Run the test suite
        run: |
          minimap2 --version
          samtools --version | head -1
          python -m pytest tests -q -p no:cacheprovider

  package:
    name: wheel smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Wheel contains only the fiberhmm package
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel, = glob.glob("dist/fiberhmm-*.whl")
          tops = {name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()}
          extra = {t for t in tops if t != "fiberhmm" and not t.endswith(".dist-info")}
          assert not extra, f"unexpected top-level entries in {wheel}: {sorted(extra)}"
          # Data files outside the package-data globs are easy to lose.
          names = set(zipfile.ZipFile(wheel).namelist())
          for required in ("fiberhmm/advisories.json",
                           "fiberhmm/models/SUPPORTED_MODES.json",
                           "fiberhmm/inference/consensus/harmonized_families/reference/SOURCE_MANIFEST.json"):
              assert required in names, f"{required} missing from {wheel}"
          print(wheel, sorted(tops))
          EOF
      # The installed-script run below aligns with minimap2 (fiberhmm-pipeline).
      - name: Install pinned minimap2 and samtools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools
          tarball="minimap2-${MINIMAP2_VERSION}_x64-linux.tar.bz2"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/lh3/minimap2/releases/download/v${MINIMAP2_VERSION}/$tarball"
          echo "$MINIMAP2_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/minimap2-${MINIMAP2_VERSION}_x64-linux" >> "$GITHUB_PATH"
      - name: Install minimap2 and samtools (macOS)
        if: runner.os == 'macOS'
        run: brew install minimap2 samtools
      - name: Install the wheel into a clean venv (core dependencies only)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/fiberhmm-*.whl
      - name: Run --help for every console script
        # Run outside the checkout so the installed wheel, not the source tree, is used.
        working-directory: ${{ runner.temp }}
        run: |
          VENV="$RUNNER_TEMP/venv"
          scripts=$("$VENV/bin/python" -c "from importlib.metadata import distribution; print('\n'.join(sorted(e.name for e in distribution('fiberhmm').entry_points if e.group == 'console_scripts')))")
          test -n "$scripts"
          status=0
          for script in $scripts; do
            if "$VENV/bin/$script" --help > /dev/null; then
              echo "ok   $script"
            else
              echo "::error::$script --help failed"
              status=1
            fi
          done
          exit $status
      - name: Run installed fiberhmm-call and fiberhmm-pipeline on tiny synthetic data
        # --help alone passes with a broken _entry shim; this runs the installed executables on
        # data and checks that the output BAMs carry footprint tags. Outside the checkout, so the
        # wheel (not the source tree) is imported; the helper itself imports only numpy and pysam.
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/tools/ci/installed_scripts_smoke.py" \
            --bin "$RUNNER_TEMP/venv/bin" --workdir "$RUNNER_TEMP/installed-smoke"
      - name: Run installed fiberhmm-pipeline under minimap2 2.27 (Linux)
        # minimap2 2.27 (the Ubuntu 24.04 package) answers --MD with a cs tag and
        # no MD; fiberhmm-pipeline must compute MD from the reference itself.
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          tarball="minimap2-2.27_x64-linux.tar.bz2"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/lh3/minimap2/releases/download/v2.27/$tarball"
          echo "$MINIMAP2_227_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mm227" && tar -xjf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/mm227"
          export PATH="$RUNNER_TEMP/mm227/minimap2-2.27_x64-linux:$PATH"
          minimap2 --version
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/tools/ci/installed_scripts_smoke.py" \
            --bin "$RUNNER_TEMP/venv/bin" --workdir "$RUNNER_TEMP/installed-smoke-mm227"
